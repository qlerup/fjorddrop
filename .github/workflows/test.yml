name: Test and container build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m playwright install --with-deps chromium
      - name: Real HTTPS rendezvous and HTTP peer browser test
        run: |
          python tests/browser_server.py > /tmp/fjorddrop-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 40); do
            test -f test-results/browser-config.json && break
            sleep 1
          done
          python tests/browser_check.py
          python tests/room_browser_check.py
          python tests/room_browser_check.py --slow-gathering
          python tests/http_receive_browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: |
            test-results/*.png
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: vpnturn/go.sum
      - run: cd vpnturn && go test -race ./...
      - run: docker build -t fjorddrop:test .
      - name: Automatic Coturn installation and authenticated relay
        run: |
          sudo ip addr add 203.0.113.1/32 dev lo
          mkdir -p /tmp/turn-app-data /tmp/turn-shared /tmp/turn-received
          chmod 777 /tmp/turn-app-data /tmp/turn-received
          export DATA_DIR=/tmp/turn-app-data SHARED_DIR=/tmp/turn-shared RECEIVED_DIR=/tmp/turn-received
          export TURN_PUBLIC_IP=203.0.113.1 TURN_RELAY_IP=203.0.113.1
          docker compose up -d --build --wait --wait-timeout 90
          trap 'docker compose down' EXIT
          python tests/turn_integration.py
          docker compose down
      - name: Non-root container smoke test
        run: |
          mkdir -p /tmp/drop-data /tmp/drop-shared /tmp/drop-received
          chmod 777 /tmp/drop-data /tmp/drop-received
          docker run -d --name drop-smoke --network host --read-only --tmpfs /tmp -e DATA_DIR=/data -e SHARED_DIR=/shared -e RECEIVED_DIR=/received -v /tmp/drop-data:/data -v /tmp/drop-shared:/shared:ro -v /tmp/drop-received:/received fjorddrop:test
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8102/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8102/healthz
          docker stop drop-smoke
      - name: Container diagnostics on failure
        if: always()
        run: |
          docker logs fjorddrop-turn --tail 50 2>&1 || true
          docker inspect fjorddrop-turn --format '{{json .State}}' || true
